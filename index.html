<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Coolita App</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 { font-size: 2.5rem; }
        .box {
            margin: 20px auto;
            padding: 20px;
            width: 80%;
            max-width: 600px;
            background: #1f1f1f;
            border-radius: 8px;
            border: 2px solid #333;
        }
        .box.active {
            border-color: #e50914; /* Couleur style Netflix pour le focus */
            background: #2b2b2b;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Test de compatibilité Coolita OS</h1>
    
    <div class="box active" id="menuItem">
        <h3>Bouton de Test</h3>
        <p>Si tu vois ce texte, le rendu HTML/CSS fonctionne.</p>
        <button id="testBtn">Clique ici ou Appuie sur OK</button>
    </div>

    <div class="box">
        <h3>Test Vidéo HTML5</h3>
        <!-- Vidéo de test libre de droits -->
        <video id="testVideo" width="400" controls>
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
            Ton navigateur ne supporte pas la vidéo.
        </video>
    </div>

    <script>
        // Afficher des infos sur le navigateur de la TV pour voir ce qu'il a dans le ventre
        console.log("User-Agent : " + navigator.userAgent);
        
        // Test basique d'interaction
        const btn = document.getElementById('testBtn');
        btn.addEventListener('click', () => {
            alert("Interaction JavaScript OK ! User-Agent : " + navigator.userAgent);
        });
    </script>

</body>
</html>
